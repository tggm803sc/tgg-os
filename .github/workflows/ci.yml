name: CI

on:
  push:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Show Node version
        run: node --version
      # .npmrc sets engine-strict, so this fails if Node is outside package.json engines
      - name: Install dependencies
        run: npm ci
      - run: npm run typecheck
      - run: npm run build
